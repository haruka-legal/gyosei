name: Build and Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Japanese site
        run: npx @11ty/eleventy

      - name: Build Visa site
        run: npx @11ty/eleventy --config=.eleventy-visa.js

      - name: Build Souzoku site
        run: npx @11ty/eleventy --config=.eleventy-souzoku.js

      - name: Build Fuei site
        run: npx @11ty/eleventy --config=.eleventy-fuei.js

      - name: Build Minpaku blog (記事が1本以上あるときだけ)
        run: |
          if ls src/minpaku/articles/*.md >/dev/null 2>&1; then
            npx @11ty/eleventy --config=.eleventy-minpaku.js
          fi

      - name: Copy root entrance page
        run: cp -r src/root/. _site/

      - name: Add minpaku sitemap to the sitemap index (公開したときだけ)
        run: |
          if [ -f _site/minpaku/sitemap.xml ] && ! grep -q minpaku _site/sitemap.xml; then
            sed -i 's#</sitemapindex>#  <sitemap><loc>https://haruka-legal.com/minpaku/sitemap.xml</loc></sitemap>\n</sitemapindex>#' _site/sitemap.xml
          fi

      - name: Add latest articles to the top page (新着記事)
        run: node scripts/build-news.js _site

      - name: Check links (他ドメイン混入チェック)
        run: node scripts/check-domains.js _site

      - name: List changed pages for IndexNow (Bing へ知らせるURL)
        run: node scripts/indexnow-urls.js "${{ github.event.before }}" "${{ github.sha }}" _site > indexnow-urls.txt; cat indexnow-urls.txt

      - name: Keep the URL list for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Get the URL list
        uses: actions/download-artifact@v4
        with:
          name: indexnow-urls

      - name: Tell Bing about new and updated pages (IndexNow)
        continue-on-error: true
        run: |
          if [ ! -s indexnow-urls.txt ]; then echo "送るURLはありません"; exit 0; fi
          KEY="127e2171bb394b14028668414462cba6"
          URLS=$(python3 -c "import json,sys;print(json.dumps([l.strip() for l in open('indexnow-urls.txt') if l.strip()][:10000]))")
          BODY="{\"host\":\"haruka-legal.com\",\"key\":\"$KEY\",\"keyLocation\":\"https://haruka-legal.com/$KEY.txt\",\"urlList\":$URLS}"
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" -d "$BODY"
