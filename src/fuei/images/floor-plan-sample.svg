<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 740" width="700" height="740" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <rect width="700" height="740" fill="#ffffff"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#222">営業所平面図（記載例）</text>
  <text x="40" y="64" font-size="13" fill="#666">架空のスナックの例です。実際の書き方は申請する警察署に確かめてください。　単位：m</text>

  <!-- 原点 (110,120)、1m = 70px。内寸 7.0m × 6.0m -->
  <g transform="translate(110,120)">
    <!-- 外壁 -->
    <rect x="-8" y="-8" width="506" height="436" fill="#555"/>
    <rect x="0" y="0" width="490" height="420" fill="#ffffff"/>

    <!-- 客室（色付け） -->
    <rect x="0" y="105" width="490" height="315" fill="#fde8e8"/>
    <!-- 調理場 -->
    <rect x="0" y="0" width="385" height="105" fill="#e8f0fb"/>
    <!-- トイレ -->
    <rect x="385" y="0" width="105" height="105" fill="#eef7ee"/>

    <!-- 間仕切り壁 -->
    <rect x="382" y="0" width="6" height="105" fill="#555"/>
    <rect x="388" y="102" width="102" height="6" fill="#555"/>
    <!-- トイレの扉 -->
    <rect x="400" y="102" width="60" height="6" fill="#ffffff"/>
    <path d="M400 108 A60 60 0 0 0 460 168" fill="none" stroke="#999" stroke-dasharray="4 3"/>
    <line x1="400" y1="108" x2="400" y2="168" stroke="#999"/>

    <!-- カウンター（高さ1.0m以下） -->
    <rect x="35" y="92" width="315" height="26" fill="#c9a77c" stroke="#7a5a33"/>
    <text x="192" y="110" font-size="13" text-anchor="middle" fill="#3b2a14">カウンター</text>
    <!-- カウンターの椅子 6脚 -->
    <g fill="#ffffff" stroke="#444">
      <circle cx="70" cy="140" r="11"/><circle cx="118" cy="140" r="11"/><circle cx="166" cy="140" r="11"/>
      <circle cx="214" cy="140" r="11"/><circle cx="262" cy="140" r="11"/><circle cx="310" cy="140" r="11"/>
    </g>

    <!-- ボックス席 -->
    <rect x="280" y="250" width="185" height="34" rx="6" fill="#b9c7d8" stroke="#445"/>
    <text x="372" y="272" font-size="12" text-anchor="middle" fill="#223">ソファ</text>
    <rect x="300" y="300" width="145" height="50" fill="#ffffff" stroke="#444"/>
    <text x="372" y="330" font-size="12" text-anchor="middle" fill="#333">テーブル</text>
    <rect x="280" y="366" width="185" height="34" rx="6" fill="#b9c7d8" stroke="#445"/>
    <text x="372" y="388" font-size="12" text-anchor="middle" fill="#223">ソファ</text>

    <!-- 出入口 -->
    <rect x="35" y="414" width="70" height="12" fill="#ffffff"/>
    <path d="M35 420 A70 70 0 0 1 105 350" fill="none" stroke="#999" stroke-dasharray="4 3"/>
    <line x1="35" y1="420" x2="35" y2="350" stroke="#999"/>
    <text x="70" y="452" font-size="13" text-anchor="middle" fill="#222">▲ 出入口</text>

    <!-- 照明（●）とスピーカー（■） -->
    <g fill="#f2b600" stroke="#8a6a00">
      <circle cx="80" cy="200" r="7"/><circle cx="200" cy="200" r="7"/><circle cx="320" cy="200" r="7"/>
      <circle cx="80" cy="330" r="7"/><circle cx="200" cy="330" r="7"/><circle cx="440" cy="200" r="7"/>
    </g>
    <g fill="#333">
      <rect x="6" y="160" width="12" height="12"/><rect x="472" y="300" width="12" height="12"/>
    </g>

    <!-- 部屋の名前 -->
    <text x="192" y="40" font-size="15" text-anchor="middle" fill="#2a4a7a">調理場</text>
    <text x="437" y="58" font-size="14" text-anchor="middle" fill="#2a5a2a">トイレ</text>
    <text x="150" y="275" font-size="18" font-weight="700" text-anchor="middle" fill="#b03030">客室</text>

    <!-- 寸法線：横 7.0 -->
    <g stroke="#333" fill="#333" font-size="13">
      <line x1="0" y1="-30" x2="490" y2="-30"/>
      <line x1="0" y1="-38" x2="0" y2="-22"/><line x1="490" y1="-38" x2="490" y2="-22"/>
      <text x="245" y="-38" text-anchor="middle" stroke="none">7.0</text>
      <!-- 縦 6.0 -->
      <line x1="-40" y1="0" x2="-40" y2="420"/>
      <line x1="-48" y1="0" x2="-32" y2="0"/><line x1="-48" y1="420" x2="-32" y2="420"/>
      <text x="-50" y="214" text-anchor="end" stroke="none">6.0</text>
      <!-- 調理場の奥行き 1.5 -->
      <line x1="520" y1="0" x2="520" y2="105"/>
      <line x1="512" y1="0" x2="528" y2="0"/><line x1="512" y1="105" x2="528" y2="105"/>
      <text x="532" y="58" stroke="none">1.5</text>
      <!-- 客室の奥行き 4.5 -->
      <line x1="520" y1="105" x2="520" y2="420"/>
      <line x1="512" y1="420" x2="528" y2="420"/>
      <text x="532" y="268" stroke="none">4.5</text>
      <!-- 調理場の幅 5.5 / トイレ 1.5 -->
      <text x="192" y="-12" text-anchor="middle" stroke="none" font-size="12" fill="#666">5.5</text>
      <text x="437" y="-12" text-anchor="middle" stroke="none" font-size="12" fill="#666">1.5</text>
    </g>
  </g>

  <!-- 凡例 -->
  <g transform="translate(110,600)" font-size="13" fill="#222">
    <circle cx="8" cy="-4" r="7" fill="#f2b600" stroke="#8a6a00"/><text x="22" y="0">照明（ダウンライト）×6</text>
    <rect x="200" y="-10" width="12" height="12" fill="#333"/><text x="220" y="0">スピーカー×2</text>
    <circle cx="350" cy="-4" r="9" fill="#fff" stroke="#444"/><text x="364" y="0">椅子×6</text>
    <text x="0" y="24" fill="#666">寸法はすべて壁の内側で測った長さ（内寸）。カウンター・ソファの高さは1.0m以下。</text>
  </g>

  <!-- 求積表 -->
  <g transform="translate(110,660)" font-size="14" fill="#222">
    <text x="0" y="0" font-weight="700">求積表</text>
    <text x="0" y="24">営業所の面積：7.0 × 6.0 ＝ 42.00㎡</text>
    <text x="0" y="46" fill="#b03030">客室の面積：7.0 × 4.5 ＝ 31.50㎡</text>
    <text x="300" y="24">調理場：5.5 × 1.5 ＝ 8.25㎡</text>
    <text x="300" y="46">トイレ：1.5 × 1.5 ＝ 2.25㎡</text>
  </g>
</svg>
