<style>
  :root{--ink:#14315a;--blue:#1f5fae;--sky:#eef5fd;--line:#cddff0;--muted:#5a6b80;
    --mincho:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;--gothic:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--gothic);color:var(--ink);background:#fff;line-height:1.9;font-size:16.5px}
  a{color:var(--blue)}
  .top{border-bottom:1px solid var(--line)}
  .top div{max-width:820px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
  .top img{width:40px;height:40px}
  .top a{text-decoration:none;color:var(--ink);font-family:var(--mincho);font-weight:700;font-size:18px}
  main{max-width:820px;margin:0 auto;padding:40px 20px 72px}
  .crumb{font-size:13.5px;color:var(--muted);margin-bottom:12px}
  .crumb a{color:var(--muted)}
  h1{font-family:var(--mincho);font-size:clamp(24px,4.6vw,32px);line-height:1.5;margin-bottom:20px;word-break:auto-phrase}
  h2{font-size:21px;line-height:1.5;margin:48px 0 14px;padding-left:12px;border-left:4px solid var(--blue)}
  h3{font-size:18px;line-height:1.5;margin:28px 0 8px}
  p{margin:0 0 14px}
  ul{margin:0 0 14px;padding-left:1.3em}
  li{margin:4px 0}
  .lead{font-size:17px}
  .box{background:var(--sky);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:18px 0}
  .box ul{margin:0}
  .links{list-style:none;padding:0;display:grid;gap:10px;margin-top:14px}
  .links a{display:block;padding:14px 18px;border:1.5px solid var(--blue);border-radius:10px;text-decoration:none;font-weight:700}
  .links a:hover{background:var(--sky)}
  footer{border-top:1px solid var(--line);text-align:center;font-size:13.5px;color:var(--muted);padding:20px}
  footer a{color:var(--muted)}
  .cta{margin-top:36px;padding:24px 20px;border:1px solid var(--line);border-radius:12px;background:var(--sky);text-align:center}
  .cta p{font-weight:700;margin:0 0 16px;word-break:auto-phrase}
  .cta p span{font-weight:400;font-size:14px}
  .cta-btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .cta-btns a{flex:1 1 200px;max-width:260px;display:inline-flex;align-items:center;justify-content:center;min-height:50px;border-radius:999px;font-weight:700;text-decoration:none}
  .cta-line{background:#06c755;color:#fff}
  .cta-form{border:1.5px solid var(--blue);color:var(--blue);background:#fff}
  header.top .brand{display:flex;flex-direction:column;line-height:1.25;text-decoration:none}
  header.top .brand-sub{font-size:12.5px;font-weight:400;color:var(--muted);letter-spacing:.12em;margin-top:3px;align-self:flex-end}
  table{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:15.5px}
  th,td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
  th{background:var(--sky);font-weight:700;white-space:nowrap}
  .note{font-size:14.5px;color:var(--muted)}
  .hk-form{margin-top:8px}
</style>
<link rel="stylesheet" href="/assets/hk-form.css">
